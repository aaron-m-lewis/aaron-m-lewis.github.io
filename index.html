<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aaron Lewis | Digital Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="profile">
      <div class="avatar-wrap">
        <img src="media/headshot.jpg" alt="Aaron Lewis headshot" class="avatar">
      </div>
      <div class="profile-details">
        <h1>Aaron M. Lewis</h1>
        <p class="handle">Seattle, WA</p>
        <p class="bio">Software Development Engineer @ Amazon</p>
        <div class="profile-actions">
          <a class="button" href="mailto:me@aaronmlewis.com">Contact</a>
          <a class="button secondary" href="media/aaron_lewis_resume.pdf" target="_blank" rel="noreferrer noopener">Resume</a>
        </div>
      </div>
    </header>

    <main id="posts" class="feed">
      <section class="grid" id="post-grid" aria-live="polite"></section>
    </main>
  </div>

  <template id="post-template">
    <a class="tile" data-tile target="_blank" rel="noreferrer noopener">
      <div class="tile-meta">
        <div class="tags" data-tags></div>
      </div>
      <h3 data-title></h3>
      <p data-body></p>
    </a>
  </template>

  <script src="script.js"></script>
</body>
</html>
